[template]
id          = "mira"
name        = "Mira"
description = "Self-hosted AI code reviewer with a dashboard, codebase indexing and CVE scanning for GitHub, GitLab and Forgejo. Bring your own LLM."
version     = "0.10.1"
categories  = ["developer-tools", "ai"]
tags        = ["code-review", "pull-requests", "llm", "github", "gitlab", "forgejo", "gitea", "webhooks", "security"]
platforms   = ["linux/amd64"]
icon        = "https://github.com/miracodeai.png"
website     = "https://miracode.ai"
docs        = "https://docs.miracode.ai"
source      = "https://github.com/miracodeai/mira"
license     = "Apache-2.0"

[files]
setup = "setup.md"

[[ports]]
container   = 8000
description = "Dashboard and webhooks"
primary     = true
