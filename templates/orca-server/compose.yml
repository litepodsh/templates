services:
  orca-server:
    # Orca publishes no container image, and LitePod's podman-compose can't build a
    # dockerfile_inline, so this installs the upstream release on a plain Ubuntu at startup.
    # Adapted from Dokploy's MIT-licensed orca-server blueprint.
    image: docker.io/library/ubuntu:24.04
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    expose:
      - "6768"
    environment:
      ORCA_VERSION: ${ORCA_VERSION}
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS}
      ORCA_SERVE_ARGS: ${ORCA_SERVE_ARGS}
    volumes:
      - orca_home:/home/orca
      - orca_app:/opt/orca
    entrypoint:
      - bash
      - -c
      - |
        set -eu
        if [ ! -e /var/lib/orca-deps-installed ]; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl file git jq openssh-client procps \
            xvfb zlib1g-dev libgtk-3-0t64 libpango-1.0-0 libcairo2 \
            libnss3 libgbm1 libdrm2 libasound2t64 libcups2t64 libxkbcommon0 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxrender1 libxss1 libxtst6
          rm -rf /var/lib/apt/lists/*
          touch /var/lib/orca-deps-installed
        fi

        # Kept in a volume, so a redeploy only downloads again when the version changes.
        app="/opt/orca/$$ORCA_VERSION"
        if [ ! -x "$$app/AppRun" ]; then
          case "$$(dpkg --print-architecture)" in
            amd64) asset=orca-linux.AppImage ;;
            arm64) asset=orca-linux-arm64.AppImage ;;
            *) echo "Orca has no Linux release for $$(dpkg --print-architecture)" >&2; exit 1 ;;
          esac
          rm -rf /opt/orca/*
          cd /opt/orca
          curl -fL --retry 3 -o orca.AppImage \
            "https://github.com/stablyai/orca/releases/download/$$ORCA_VERSION/$$asset"
          chmod +x orca.AppImage
          ./orca.AppImage --appimage-extract >/dev/null
          rm orca.AppImage
          chmod -R a+rX squashfs-root
          mv squashfs-root "$$ORCA_VERSION"
        fi

        id orca >/dev/null 2>&1 || useradd --uid 10001 --no-create-home --home-dir /home/orca --shell /bin/bash orca
        chown orca:orca /home/orca

        # --no-sandbox: Chromium can't create its namespaces in an unprivileged container.
        # ORCA_SERVE_ARGS stays unquoted so it can hold several flags.
        exec setpriv --reuid=orca --regid=orca --init-groups env \
          HOME=/home/orca USER=orca LIBGL_ALWAYS_SOFTWARE=1 \
          PATH="/home/orca/.local/bin:$$app/resources/bin:/usr/local/bin:/usr/bin:/bin" \
          "$$app/AppRun" --no-sandbox serve --port 6768 \
          --pairing-address "$$ORCA_PAIRING_ADDRESS" $$ORCA_SERVE_ARGS
    healthcheck:
      # CMD-SHELL: podman-compose 1.3.0 breaks the quoting of a CMD list with shell syntax.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6768'"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start installs packages and downloads the release.
      start_period: 300s

volumes:
  orca_home:
  orca_app:
