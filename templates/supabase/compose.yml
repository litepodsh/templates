# Supabase self-hosted stack.
# Based on the official supabase/docker-compose, trimmed to the runtime services
# (no supavisor pooler, no logflare/vector analytics — both opt-in upstream too).
# Every image is pinned to the set published in supabase/supabase `docker/versions.md`;
# bump in one place per release. `kong` is the single HTTP entry point for the API,
# Auth, REST, Realtime, Storage, and Functions.
#
# Upstream ships the gateway config, the Postgres bootstrap SQL and the edge
# functions entrypoint as bind mounts. Bind mounts don't work rootless, so they
# are inlined as compose `configs` instead. Compose interpolates config content,
# so every literal `$` below is written `$$`.
x-kong-config: &kong-config |
  _format_version: "2.1"

  services:
    - name: auth-v1-open
      url: http://auth:9999/verify
      routes:
        - name: auth-v1-open
          strip_path: true
          paths:
            - /auth/v1/verify
    - name: auth-v1-open-callback
      url: http://auth:9999/callback
      routes:
        - name: auth-v1-open-callback
          strip_path: true
          paths:
            - /auth/v1/callback
    - name: auth-v1-open-jwks
      url: http://auth:9999/.well-known/jwks.json
      routes:
        - name: auth-v1-open-jwks
          strip_path: true
          paths:
            - /auth/v1/.well-known/jwks.json
    - name: auth-v1
      url: http://auth:9999
      routes:
        - name: auth-v1-all
          strip_path: true
          paths:
            - /auth/v1
      plugins:
        - name: cors
    - name: rest-v1
      url: http://rest:3000
      routes:
        - name: rest-v1-all
          strip_path: true
          paths:
            - /rest/v1
      plugins:
        - name: cors
    - name: realtime-v1
      url: http://realtime-dev.supabase-realtime:4000/socket
      routes:
        - name: realtime-v1-all
          strip_path: true
          paths:
            - /realtime/v1
      plugins:
        - name: cors
    - name: storage-v1
      url: http://storage:5000
      routes:
        - name: storage-v1-all
          strip_path: true
          paths:
            - /storage/v1
      plugins:
        - name: cors
    - name: functions-v1
      url: http://functions:9000
      routes:
        - name: functions-v1-all
          strip_path: true
          paths:
            - /functions/v1
      plugins:
        - name: cors
    - name: imgproxy-v1
      url: http://imgproxy:5001
      routes:
        - name: imgproxy-v1-all
          strip_path: true
          paths:
            - /imgproxy

# Aligns the roles baked into the supabase/postgres image with POSTGRES_PASSWORD.
# Without this, auth/storage/rest cannot authenticate against the database.
x-roles-sql: &roles-sql |
  \set pgpass `echo "$$POSTGRES_PASSWORD"`

  ALTER USER authenticator WITH PASSWORD :'pgpass';
  ALTER USER pgbouncer WITH PASSWORD :'pgpass';
  ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
  ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
  ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';

# Exposes the JWT settings to SQL (`auth.jwt()` and friends read these).
x-jwt-sql: &jwt-sql |
  \set jwt_secret `echo "$$JWT_SECRET"`
  \set jwt_exp `echo "$$JWT_EXP"`

  ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
  ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';

# Realtime keeps its own state in `_realtime` (see DB_AFTER_CONNECT_QUERY).
x-realtime-sql: &realtime-sql |
  \set pguser `echo "$$POSTGRES_USER"`

  create schema if not exists _realtime;
  alter schema _realtime owner to :pguser;

# Database Webhooks: the `supabase_functions` schema Studio drives, plus pg_net.
# Runs before roles.sql because it creates supabase_functions_admin.
x-webhooks-sql: &webhooks-sql |
  BEGIN;
    CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
    CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
    GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
    ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
    ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
    ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
    CREATE TABLE supabase_functions.migrations (
      version text PRIMARY KEY,
      inserted_at timestamptz NOT NULL DEFAULT NOW()
    );
    INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
    CREATE TABLE supabase_functions.hooks (
      id bigserial PRIMARY KEY,
      hook_table_id integer NOT NULL,
      hook_name text NOT NULL,
      created_at timestamptz NOT NULL DEFAULT NOW(),
      request_id bigint
    );
    CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
    CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
    COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
    CREATE FUNCTION supabase_functions.http_request()
      RETURNS trigger
      LANGUAGE plpgsql
      AS $$function$$
      DECLARE
        request_id bigint;
        payload jsonb;
        url text := TG_ARGV[0]::text;
        method text := TG_ARGV[1]::text;
        headers jsonb DEFAULT '{}'::jsonb;
        params jsonb DEFAULT '{}'::jsonb;
        timeout_ms integer DEFAULT 1000;
      BEGIN
        IF url IS NULL OR url = 'null' THEN
          RAISE EXCEPTION 'url argument is missing';
        END IF;

        IF method IS NULL OR method = 'null' THEN
          RAISE EXCEPTION 'method argument is missing';
        END IF;

        IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
          headers = '{"Content-Type": "application/json"}'::jsonb;
        ELSE
          headers = TG_ARGV[2]::jsonb;
        END IF;

        IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
          params = '{}'::jsonb;
        ELSE
          params = TG_ARGV[3]::jsonb;
        END IF;

        IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
          timeout_ms = 1000;
        ELSE
          timeout_ms = TG_ARGV[4]::integer;
        END IF;

        CASE
          WHEN method = 'GET' THEN
            SELECT http_get INTO request_id FROM net.http_get(
              url,
              params,
              headers,
              timeout_ms
            );
          WHEN method = 'POST' THEN
            payload = jsonb_build_object(
              'old_record', OLD,
              'record', NEW,
              'type', TG_OP,
              'table', TG_TABLE_NAME,
              'schema', TG_TABLE_SCHEMA
            );

            SELECT http_post INTO request_id FROM net.http_post(
              url,
              payload,
              params,
              headers,
              timeout_ms
            );
          ELSE
            RAISE EXCEPTION 'method argument % is invalid', method;
        END CASE;

        INSERT INTO supabase_functions.hooks
          (hook_table_id, hook_name, request_id)
        VALUES
          (TG_RELID, TG_NAME, request_id);

        RETURN NEW;
      END
    $$function$$;
    DO
    $$$$
    BEGIN
      IF NOT EXISTS (
        SELECT 1
        FROM pg_roles
        WHERE rolname = 'supabase_functions_admin'
      )
      THEN
        CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
      END IF;
    END
    $$$$;
    GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
    ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
    ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
    ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
    ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
    GRANT supabase_functions_admin TO postgres;
    DO
    $$$$
    BEGIN
      IF EXISTS (
        SELECT 1
        FROM pg_roles
        WHERE rolname = 'supabase_pg_net_admin'
      )
      THEN
        REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
        DROP OWNED BY supabase_pg_net_admin;
        DROP ROLE supabase_pg_net_admin;
      END IF;
    END
    $$$$;
    DO
    $$$$
    BEGIN
      IF EXISTS (
        SELECT 1
        FROM pg_extension
        WHERE extname = 'pg_net'
      )
      THEN
        GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
        ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
        ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
        ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
        ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
        REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
        REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
        GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
        GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
      END IF;
    END
    $$$$;
    CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
    RETURNS event_trigger
    LANGUAGE plpgsql
    AS $$$$
    BEGIN
      IF EXISTS (
        SELECT 1
        FROM pg_event_trigger_ddl_commands() AS ev
        JOIN pg_extension AS ext
        ON ev.objid = ext.oid
        WHERE ext.extname = 'pg_net'
      )
      THEN
        GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
        ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
        ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
        ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
        ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
        REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
        REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
        GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
        GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
      END IF;
    END;
    $$$$;
    COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
    DO
    $$$$
    BEGIN
      IF NOT EXISTS (
        SELECT 1
        FROM pg_event_trigger
        WHERE evtname = 'issue_pg_net_access'
      ) THEN
        CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
        EXECUTE PROCEDURE extensions.grant_pg_net_access();
      END IF;
    END
    $$$$;
    INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
    ALTER function supabase_functions.http_request() SECURITY DEFINER;
    ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
    REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
  COMMIT;

# Edge runtime main service: verifies the JWT, then dispatches to
# /home/deno/functions/<name>. Upstream also accepts asymmetric JWKS keys; this
# stack only issues legacy HS256 keys, so it checks JWT_SECRET.
x-functions-main: &functions-main |
  import * as jose from 'jsr:@panva/jose@6'

  const JWT_SECRET = Deno.env.get('JWT_SECRET')
  const VERIFY_JWT = Deno.env.get('VERIFY_JWT') === 'true'

  function json(body: unknown, status: number) {
    return new Response(JSON.stringify(body), {
      status,
      headers: { 'Content-Type': 'application/json' },
    })
  }

  async function isValidJWT(token: string): Promise<boolean> {
    if (!JWT_SECRET) {
      console.error('JWT_SECRET not available for HS256 token verification')
      return false
    }
    try {
      await jose.jwtVerify(token, new TextEncoder().encode(JWT_SECRET))
      return true
    } catch (e) {
      console.error('JWT verification error', e)
      return false
    }
  }

  Deno.serve(async (req: Request) => {
    if (req.method !== 'OPTIONS' && VERIFY_JWT) {
      const [bearer, token] = (req.headers.get('authorization') ?? '').split(' ')
      if (bearer !== 'Bearer' || !token) {
        return json({ msg: "Auth header is not 'Bearer {token}'" }, 401)
      }
      if (!(await isValidJWT(token))) {
        return json({ msg: 'Invalid JWT' }, 401)
      }
    }

    const serviceName = new URL(req.url).pathname.split('/')[1]
    if (!serviceName) {
      return json({ msg: 'missing function name in request' }, 400)
    }

    try {
      const worker = await EdgeRuntime.userWorkers.create({
        servicePath: '/home/deno/functions/' + serviceName,
        memoryLimitMb: 150,
        workerTimeoutMs: 60000,
        noModuleCache: false,
        importMapPath: null,
        envVars: Object.entries(Deno.env.toObject()),
      })
      return await worker.fetch(req)
    } catch (e) {
      return json({ msg: String(e) }, 500)
    }
  })

configs:
  kong_config:
    content: *kong-config
  db_roles_sql:
    content: *roles-sql
  db_jwt_sql:
    content: *jwt-sql
  db_realtime_sql:
    content: *realtime-sql
  db_webhooks_sql:
    content: *webhooks-sql
  functions_main:
    content: *functions-main

services:
  studio:
    image: docker.io/supabase/studio:2026.07.07-sha-a6a04f2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Uncomment to publish Studio directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${STUDIO_PORT}:3000"
    environment:
      # Listen on all IPv4 interfaces, not just loopback.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME}
      DEFAULT_PROJECT_NAME: ${DEFAULT_PROJECT_NAME}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # Logs & Analytics (logflare + vector) is not part of this stack.
      ENABLED_FEATURES_LOGS_ALL: "false"

  kong:
    image: docker.io/kong/kong:3.9.1
    restart: unless-stopped
    ports:
      - "${KONG_HTTP_PORT}:8000"
      - "${KONG_HTTPS_PORT}:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      # https://github.com/supabase/cli/issues/14
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    configs:
      - source: kong_config
        target: /var/lib/kong/kong.yml

  auth:
    image: docker.io/supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_SIGNIN}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${ENABLE_GITHUB_SIGNIN}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

  rest:
    # `supabase/postgrest` stopped publishing tags; upstream tracks the PostgREST
    # image directly.
    image: docker.io/postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  realtime:
    # Realtime derives its tenant id from the request subdomain, so the container
    # name is load-bearing: it must match the `realtime-dev` tenant seeded by
    # SEED_SELF_HOST, and the kong upstream above points at this name.
    container_name: realtime-dev.supabase-realtime
    image: docker.io/supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    image: docker.io/supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - supabase_storage_data:/var/lib/storage

  imgproxy:
    image: docker.io/darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    # Same volume as `storage`: imgproxy reads the originals off disk.
    volumes:
      - supabase_storage_data:/var/lib/storage

  meta:
    image: docker.io/supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  functions:
    image: docker.io/supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
    configs:
      - source: functions_main
        target: /home/deno/functions/main/index.ts
    volumes:
      - supabase_deno_cache:/root/.cache/deno
    command: ["start", "--main-service", "/home/deno/functions/main"]

  db:
    image: docker.io/supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      # POSTGRES_USER is deliberately not set: the image defaults it to
      # `supabase_admin`, which is the role initdb creates and the one the
      # image's own migrate.sh connects as.
      # PGPASSWORD/JWT_EXP are read by the init scripts below, not by the server.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    # `init-scripts` runs as superuser before `migrations`; the numeric prefixes
    # set the order within each directory.
    configs:
      - source: db_webhooks_sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
      - source: db_roles_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - source: db_jwt_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      - source: db_realtime_sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      # Keeps the generated pgsodium root key across restarts.
      - supabase_db_config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        # Keeps Realtime's polling queries out of the logs.
        "-c",
        "log_min_messages=fatal"
      ]

volumes:
  supabase_db_data:
  supabase_db_config:
  supabase_storage_data:
  supabase_deno_cache:
