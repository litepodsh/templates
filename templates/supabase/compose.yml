# Minimal rootless Supabase: Database, Auth, REST, Meta, Studio, and Kong.
x-kong-config: &kong-config |
  _format_version: "2.1"
  services:
    - name: auth-open
      url: http://auth:9999/verify
      routes:
        - name: auth-open
          strip_path: true
          paths: [/auth/v1/verify]
    - name: auth-callback
      url: http://auth:9999/callback
      routes:
        - name: auth-callback
          strip_path: true
          paths: [/auth/v1/callback]
    - name: auth
      url: http://auth:9999
      routes:
        - name: auth
          strip_path: true
          paths: [/auth/v1]
      plugins: [{ name: cors }]
    - name: rest
      url: http://rest:3000
      routes:
        - name: rest
          strip_path: true
          paths: [/rest/v1]
      plugins: [{ name: cors }]

x-roles-sql: &roles-sql |
  \set pgpass `printenv POSTGRES_PASSWORD`
  ALTER USER authenticator WITH PASSWORD :'pgpass';
  ALTER USER pgbouncer WITH PASSWORD :'pgpass';
  ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';

x-jwt-sql: &jwt-sql |
  \set jwt_secret `printenv JWT_SECRET`
  \set jwt_exp `printenv JWT_EXP`
  ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
  ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';

services:
  kong-bootstrap:
    image: docker.io/library/alpine:3.22
    environment: { KONG_CONFIG_CONTENT: *kong-config }
    volumes: [supabase_kong_config:/config]
    command: ["/bin/sh", "-ec", "printenv KONG_CONFIG_CONTENT > /config/kong.yml"]

  db-bootstrap:
    image: docker.io/supabase/postgres:17.6.1.136
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
      DB_ROLES_SQL: *roles-sql
      DB_JWT_SQL: *jwt-sql
    command: ["/bin/sh", "-ec", "printenv DB_ROLES_SQL DB_JWT_SQL | psql -v ON_ERROR_STOP=1"]

  kong:
    image: docker.io/kong/kong:3.9.3
    restart: unless-stopped
    depends_on:
      kong-bootstrap: { condition: service_completed_successfully }
    expose: ["8000"]
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes: [supabase_kong_config:/var/lib/kong]

  auth:
    image: docker.io/supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

  rest:
    image: docker.io/postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: [postgrest]

  meta:
    image: docker.io/supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: docker.io/supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    expose: ["3000"]
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME}
      DEFAULT_PROJECT_NAME: ${DEFAULT_PROJECT_NAME}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  db:
    image: docker.io/supabase/postgres:17.6.1.136
    restart: unless-stopped
    expose: ["5432"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - supabase_db_config:/etc/postgresql-custom
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 10
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=fatal]

volumes:
  supabase_kong_config:
  supabase_db_data:
  supabase_db_config:
