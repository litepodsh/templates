[template]
id          = "supabase"
name        = "Supabase"
description = "Minimal self-hosted Supabase: Postgres, Auth, REST, Studio, and Kong behind a single internal gateway."
version     = "3.0.0"
categories  = ["backend", "database"]
tags        = ["supabase", "baas", "postgres", "auth", "rest"]
icon        = "https://github.com/supabase.png"
website     = "https://supabase.com"
docs        = "https://supabase.com/docs"
source      = "https://github.com/supabase/supabase"
license     = "Apache-2.0"

# Maps the manifest to the files on disk. `compose` and `env` default to
# `compose.yml` / `.env`; `setup` defaults to `setup.md` and falls back to
# that filename when omitted, so most templates can skip this table entirely.
[files]
setup = "setup.md"

[[ports]]
container   = 8000
description = "Kong API gateway (REST/Auth/Realtime/Storage/Functions)"
primary     = true

[[ports]]
container   = 3000
description = "Studio dashboard"
