[template]
id          = "umami"
name        = "Umami"
description = "Privacy-focused, self-hosted web analytics with PostgreSQL storage."
version     = "latest"
categories  = ["analytics", "monitoring"]
tags        = ["web-analytics", "privacy", "postgresql"]
