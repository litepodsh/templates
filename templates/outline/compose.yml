# Outline needs at least one authentication provider configured (OIDC, Google,
# Slack, Azure, …) — it has no local email/password login. See setup.md.
services:
  outline:
    image: docker.io/outlinewiki/outline:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    # Uncomment to publish Outline directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${OUTLINE_PORT}:3000"
    environment:
      NODE_ENV: production
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      URL: ${OUTLINE_URL}
      PORT: "3000"
      DATABASE_URL: postgres://${OUTLINE_DB_USER}:${OUTLINE_DB_PASSWORD}@db:5432/${OUTLINE_DB_NAME}
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: ${OUTLINE_UPLOAD_MAX_SIZE}
      FORCE_HTTPS: ${OUTLINE_FORCE_HTTPS}
      # OIDC provider (fill these in or swap for GOOGLE_/SLACK_/AZURE_ equivalents).
      OIDC_CLIENT_ID: ${OUTLINE_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: ${OUTLINE_OIDC_AUTH_URI}
      OIDC_TOKEN_URI: ${OUTLINE_OIDC_TOKEN_URI}
      OIDC_USERINFO_URI: ${OUTLINE_OIDC_USERINFO_URI}
      OIDC_USERNAME_CLAIM: ${OUTLINE_OIDC_USERNAME_CLAIM}
      OIDC_DISPLAY_NAME: ${OUTLINE_OIDC_DISPLAY_NAME}
      OIDC_SCOPES: ${OUTLINE_OIDC_SCOPES}
      SMTP_HOST: ${OUTLINE_SMTP_HOST}
      SMTP_PORT: ${OUTLINE_SMTP_PORT}
      SMTP_USERNAME: ${OUTLINE_SMTP_USERNAME}
      SMTP_PASSWORD: ${OUTLINE_SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${OUTLINE_SMTP_FROM_EMAIL}
    volumes:
      - outline_data:/var/lib/outline/data

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OUTLINE_DB_NAME}
      POSTGRES_USER: ${OUTLINE_DB_USER}
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD}
    volumes:
      - outline_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OUTLINE_DB_USER} -d ${OUTLINE_DB_NAME}"]
      interval: ${OUTLINE_DB_HEALTHCHECK_INTERVAL}
      timeout: ${OUTLINE_DB_HEALTHCHECK_TIMEOUT}
      retries: ${OUTLINE_DB_HEALTHCHECK_RETRIES}

  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - outline_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  outline_data:
  outline_db_data:
  outline_redis_data:
