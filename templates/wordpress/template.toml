[template]
id          = "wordpress"
name        = "WordPress"
description = "The world's most popular CMS — a basic single-site install backed by MariaDB."
version     = "latest"
categories  = ["cms", "blog"]
tags        = ["wordpress", "cms", "blog", "php", "mariadb"]
icon        = "https://github.com/WordPress.png"
website     = "https://wordpress.org"
docs        = "https://hub.docker.com/_/wordpress"
source      = "https://github.com/WordPress/WordPress"
license     = "GPL-2.0-or-later"

[files]
setup = "setup.md"

[[ports]]
container   = 80
description = "Web UI & admin"
primary     = true
