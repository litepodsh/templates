[template]
id          = "gitea-mysql"
name        = "Gitea + MySQL"
description = "Lightweight self-hosted Git forge with MySQL, web UI and built-in SSH server."
version     = "latest"
categories  = ["developer-tools", "collaboration"]
tags        = ["git", "forge", "code-hosting", "mysql", "ci"]
icon        = "https://github.com/go-gitea.png"
website     = "https://about.gitea.com"
docs        = "https://docs.gitea.com/installation/install-with-docker-rootless"
source      = "https://github.com/go-gitea/gitea"
license     = "MIT"

[[ports]]
container   = 3000
description = "Web UI and Git over HTTP"
primary     = true

[[ports]]
container   = 2222
description = "Git over SSH"
