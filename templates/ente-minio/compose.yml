# Ente self-hosted stack: museum (API) + web apps + Postgres + MinIO object
# storage. Museum is configured entirely through ENTE_* environment overrides
# (no mounted museum.yaml). See setup.md — especially for the crypto secrets,
# which must be generated by hand.
services:
  ente-museum:
    image: ghcr.io/ente/server:latest
    restart: unless-stopped
    expose:
      - "8080"
    # ports:
    #   - "${ENTE_API_PORT}:8080"
    environment:
      ENTE_DB_HOST: ente-db
      ENTE_DB_PORT: "5432"
      ENTE_DB_NAME: ${ENTE_DB_NAME}
      ENTE_DB_USER: ${ENTE_DB_USER}
      ENTE_DB_PASSWORD: ${ENTE_DB_PASSWORD}
      ENTE_S3_ARE_LOCAL_BUCKETS: ${ENTE_S3_ARE_LOCAL_BUCKETS}
      ENTE_S3_USE_PATH_STYLE_URLS: ${ENTE_S3_USE_PATH_STYLE_URLS}
      ENTE_S3_B2_EU_CEN_KEY: ${ENTE_S3_ACCESS_KEY}
      ENTE_S3_B2_EU_CEN_SECRET: ${ENTE_S3_SECRET_KEY}
      ENTE_S3_B2_EU_CEN_ENDPOINT: ${ENTE_S3_ENDPOINT}
      ENTE_S3_B2_EU_CEN_REGION: ${ENTE_S3_REGION}
      ENTE_S3_B2_EU_CEN_BUCKET: ${ENTE_S3_BUCKET}
      ENTE_KEY_ENCRYPTION: ${ENTE_KEY_ENCRYPTION}
      ENTE_KEY_HASH: ${ENTE_KEY_HASH}
      ENTE_JWT_SECRET: ${ENTE_JWT_SECRET}
      ENTE_APPS_PUBLIC_ALBUMS: ${ENTE_ALBUMS_ORIGIN}
      ENTE_SMTP_HOST: ${ENTE_SMTP_HOST}
      ENTE_SMTP_PORT: ${ENTE_SMTP_PORT}
      ENTE_SMTP_USERNAME: ${ENTE_SMTP_USERNAME}
      ENTE_SMTP_PASSWORD: ${ENTE_SMTP_PASSWORD}
      ENTE_SMTP_EMAIL: ${ENTE_SMTP_EMAIL}
    depends_on:
      ente-db:
        condition: service_healthy
      ente-minio-provision:
        condition: service_completed_successfully
    networks:
      - ente-internal

  ente-web:
    image: ghcr.io/ente/web:latest
    restart: unless-stopped
    expose:
      - "3000"
      - "3002"
    # ports:
    #   - "${ENTE_WEB_PORT}:3000"
    #   - "${ENTE_ALBUMS_PORT}:3002"
    environment:
      ENTE_API_ORIGIN: ${ENTE_API_ORIGIN}
      ENTE_ALBUMS_ORIGIN: ${ENTE_ALBUMS_ORIGIN}
    depends_on:
      ente-museum:
        condition: service_started
    networks:
      - ente-internal

  ente-db:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENTE_DB_NAME}
      POSTGRES_USER: ${ENTE_DB_USER}
      POSTGRES_PASSWORD: ${ENTE_DB_PASSWORD}
    volumes:
      - ente_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENTE_DB_USER} -d ${ENTE_DB_NAME}"]
      interval: ${ENTE_DB_HEALTHCHECK_INTERVAL}
      timeout: ${ENTE_DB_HEALTHCHECK_TIMEOUT}
      retries: ${ENTE_DB_HEALTHCHECK_RETRIES}
    networks:
      - ente-internal

  ente-minio:
    # Pinned to the last Community Edition release with the full admin console;
    # newer tags ship only a bare object browser. No security fixes past this date.
    image: docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --address ":3200" --console-address ":3201"
    expose:
      - "3200"
      - "3201"
    # MinIO console (web UI for the object store). Uncomment to reach it directly.
    # ports:
    #   - "${ENTE_MINIO_CONSOLE_PORT}:3201"
    environment:
      MINIO_ROOT_USER: ${ENTE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ENTE_S3_SECRET_KEY}
    volumes:
      - ente_minio_data:/data
    networks:
      - ente-internal

  ente-minio-provision:
    image: docker.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set ente http://ente-minio:3200 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb -p "ente/$${ENTE_S3_BUCKET}"
        mc anonymous set none "ente/$${ENTE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${ENTE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ENTE_S3_SECRET_KEY}
      ENTE_S3_BUCKET: ${ENTE_S3_BUCKET}
    depends_on:
      ente-minio:
        condition: service_started
    networks:
      - ente-internal

networks:
  ente-internal:

volumes:
  ente_db_data:
  ente_minio_data:
