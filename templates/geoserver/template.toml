[template]
id          = "geoserver"
name        = "GeoServer"
description = "Open-source server for sharing geospatial data — publishes and edits data via OGC standards (WMS, WFS, WCS, WMTS) with a web admin UI."
version     = "latest"
categories  = ["gis", "developer-tools"]
tags        = ["gis", "geospatial", "maps", "wms", "wfs", "ogc"]
icon        = "https://github.com/geoserver.png"
website     = "https://geoserver.org"
docs        = "https://docs.geoserver.org/latest/en/user/installation/docker.html"
source      = "https://github.com/geoserver/docker"
license     = "GPL-2.0"

[files]
setup = "setup.md"

[[ports]]
container   = 8080
description = "Web admin UI & OGC services"
primary     = true
