services:
  geoserver:
    image: docker.io/geoserver/geoserver:latest
    restart: unless-stopped
    expose:
      - "8080"
    # Uncomment to publish GeoServer directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${GEOSERVER_PORT}:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: ${GEOSERVER_SKIP_DEMO_DATA}
      INSTALL_EXTENSIONS: ${GEOSERVER_INSTALL_EXTENSIONS}
      STABLE_EXTENSIONS: ${GEOSERVER_STABLE_EXTENSIONS}
      CORS_ENABLED: ${GEOSERVER_CORS_ENABLED}
      PROXY_BASE_URL: ${GEOSERVER_PROXY_BASE_URL}
    volumes:
      - geoserver_data:/opt/geoserver_data

volumes:
  geoserver_data:
