[template]
id          = "openpanel"
name        = "OpenPanel"
description = "Open-source product analytics — events, funnels, retention and web analytics. A Mixpanel/Plausible alternative for web, mobile and desktop apps."
version     = "2.3.0"
categories  = ["analytics", "monitoring"]
tags        = ["product-analytics", "events", "funnels", "clickhouse", "postgresql"]
platforms   = ["linux/amd64", "linux/arm64"]
icon        = "https://github.com/Openpanel-dev.png"
website     = "https://openpanel.dev"
docs        = "https://openpanel.dev/docs/self-hosting/self-hosting"
source      = "https://github.com/Openpanel-dev/openpanel"
license     = "AGPL-3.0"

[files]
setup = "setup.md"

[[ports]]
container   = 3000
description = "Dashboard"
primary     = true

[[ports]]
container   = 3001
description = "Event API (SDKs and tracking script)"
