# OpenPanel: dashboard, API and worker, plus Postgres, Redis and ClickHouse.
# Upstream puts its own Caddy in front to serve the API at /api; here the API
# listens on 3001 and gets its own domain from LitePod instead.
services:
  op-api:
    image: docker.io/lindesvard/openpanel-api:2.3.0
    restart: unless-stopped
    command: sh -c "CI=true pnpm -r run migrate:deploy && exec pnpm start"
    expose:
      - "3001"
    environment: &op-env
      NODE_ENV: production
      SELF_HOSTED: "true"
      API_PORT: "3001"
      BATCH_SIZE: ${OPENPANEL_BATCH_SIZE}
      BATCH_INTERVAL: ${OPENPANEL_BATCH_INTERVAL}
      ALLOW_REGISTRATION: ${OPENPANEL_ALLOW_REGISTRATION}
      ALLOW_INVITATION: ${OPENPANEL_ALLOW_INVITATION}
      DATABASE_URL: postgresql://${OPENPANEL_DB_USER}:${OPENPANEL_DB_PASSWORD}@op-db:5432/${OPENPANEL_DB_NAME}?schema=public
      DATABASE_URL_DIRECT: postgresql://${OPENPANEL_DB_USER}:${OPENPANEL_DB_PASSWORD}@op-db:5432/${OPENPANEL_DB_NAME}?schema=public
      REDIS_URL: redis://default:${OPENPANEL_REDIS_PASSWORD}@op-kv:6379
      CLICKHOUSE_URL: http://op-ch:8123/openpanel
      DASHBOARD_URL: ${OPENPANEL_DASHBOARD_URL}
      API_URL: ${OPENPANEL_API_URL}
      COOKIE_SECRET: ${OPENPANEL_COOKIE_SECRET}
      EMAIL_SENDER: ${OPENPANEL_EMAIL_SENDER}
      RESEND_API_KEY: ${OPENPANEL_RESEND_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      op-db:
        condition: service_healthy
      op-kv:
        condition: service_healthy
      op-ch:
        condition: service_healthy

  op-dashboard:
    image: docker.io/lindesvard/openpanel-dashboard:2.3.0
    restart: unless-stopped
    expose:
      - "3000"
    # Uncomment to publish the dashboard directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${OPENPANEL_PORT}:3000"
    environment: *op-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      op-api:
        condition: service_healthy

  # Queues, cron jobs and event buffering.
  op-worker:
    image: docker.io/lindesvard/openpanel-worker:2.3.0
    restart: unless-stopped
    environment: *op-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      op-api:
        condition: service_healthy

  op-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPENPANEL_DB_NAME}
      POSTGRES_USER: ${OPENPANEL_DB_USER}
      POSTGRES_PASSWORD: ${OPENPANEL_DB_PASSWORD}
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker.
      - openpanel_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENPANEL_DB_USER} -d ${OPENPANEL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  op-kv:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${OPENPANEL_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - openpanel_kv_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${OPENPANEL_REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Upstream's clickhouse-config.xml (quiet logging, no system log tables) is
  # written at start instead of bind-mounted.
  op-ch:
    image: docker.io/clickhouse/clickhouse-server:25.10.7.6-alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/clickhouse-server/config.d/openpanel.xml <<'XML'
        <clickhouse>
          <logger>
            <level>warning</level>
            <console>true</console>
          </logger>
          <keep_alive_timeout>10</keep_alive_timeout>
          <query_thread_log remove="remove"/>
          <query_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
        </clickhouse>
        XML
        cat > /etc/clickhouse-server/users.d/openpanel.xml <<'XML'
        <clickhouse>
          <profiles>
            <default>
              <log_queries>0</log_queries>
              <log_query_threads>0</log_query_threads>
            </default>
          </profiles>
        </clickhouse>
        XML
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_DB: openpanel
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - openpanel_ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  openpanel_db_data:
  openpanel_kv_data:
  openpanel_ch_data:
