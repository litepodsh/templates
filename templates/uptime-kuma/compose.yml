services:
  uptime-kuma:
    # `latest` tracks the 1.x branch upstream, so pin the major `2` tag to stay on 2.x.
    image: docker.io/louislam/uptime-kuma:2
    restart: unless-stopped
    expose:
      - "3001"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${UPTIME_KUMA_PORT}:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  uptime_kuma_data:
