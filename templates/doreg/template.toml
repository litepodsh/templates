[template]
id             = "doreg"
name           = "doreg"
description    = "Self-hosted OCI container registry with a web UI, projects and roles, robot accounts, retention policies and online garbage collection. One binary, SQLite metadata."
version        = "0.4.0"
categories     = ["developer-tools", "devops"]
tags           = ["registry", "oci", "docker", "containers", "podman", "garbage-collection"]
platforms      = ["linux/amd64", "linux/arm64"]
icon           = "https://raw.githubusercontent.com/p-arndt/doreg/main/assets/logo.svg"
website        = "https://doreg.allthing.eu"
docs           = "https://github.com/p-arndt/doreg/blob/main/docs/README.md"
source         = "https://github.com/p-arndt/doreg"
license        = "MIT"
requires_https = true

[files]
setup = "setup.md"

[[ports]]
container   = 8080
description = "Web UI and registry API (/v2/)"
primary     = true
