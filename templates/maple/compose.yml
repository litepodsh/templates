# From Maple's self-hosting docs (apps/landing/src/content/docs/self-hosting/deploy.md):
# one container with OTLP ingest, the dashboard, the query API and an embedded ClickHouse.
# The store is a local database, so run exactly one replica.
services:
  maple:
    image: ghcr.io/mapletechlabs/maple:v0.5.0
    restart: unless-stopped
    # Lets the embedded ClickHouse flush and shut down cleanly.
    stop_grace_period: 30s
    expose:
      - "4318"
    environment:
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      MAPLE_LOCAL_ACCESS_TOKEN: ${MAPLE_LOCAL_ACCESS_TOKEN}
      MAPLE_TELEMETRY: ${MAPLE_TELEMETRY}
    volumes:
      - maple_data:/data
    healthcheck:
      # /health needs no credentials. The image has no curl or wget, so this speaks HTTP over bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4318 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200 \"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  maple_data:
