# NocoDB with a bundled Postgres for zero-config use.
#
# By default, NC_DB points at the bundled `db` service (commented out below).
# Two ways to run:
#   1. Local bundled Postgres — uncomment the `db` service + its volume, then `up`.
#   2. External Postgres    — leave `db` commented, set NC_DB in .env to a
#      connection string of an existing instance, e.g.:
#        NC_DB=pg://user:pass@db.internal:5432/nocodb
services:
  nocodb:
    image: docker.io/nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "${NOCODB_PORT}:8080"
    environment:
      NC_DB: ${NC_DB}
      NC_DB_HOST: ${NC_DB_HOST}
      NC_DB_PORT: ${NC_DB_PORT}
      NC_DB_NAME: ${NC_DB_NAME}
      NC_DB_USER: ${NC_DB_USER}
      NC_DB_PASS: ${NC_DB_PASS}
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: ${NC_PUBLIC_URL}
    volumes:
      - nocodb_data:/usr/app/data
    # depends_on only applies when the bundled db service is uncommented;
    # leave the line below commented too in that case.
    # depends_on:
    #   - db

  # Uncomment the `db` block to run a bundled Postgres 16.
  # If you already have a Postgres reachable from here, leave this commented
  # and point NC_DB in .env at it instead.
  #
  # db:
  #   image: docker.io/postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - nocodb_pg_data:/var/lib/postgresql/data

volumes:
  nocodb_data:
  # nocodb_pg_data:   # uncomment with the bundled `db` service above
