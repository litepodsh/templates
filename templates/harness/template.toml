[template]
id          = "harness"
name        = "Harness Open Source"
description = "Self-hosted developer platform with Git hosting, pull requests, built-in CI/CD pipelines and artifact registries."
version     = "3.3.0"
categories  = ["developer-tools", "ci-cd"]
tags        = ["git", "forge", "code-hosting", "ci", "cd", "pipelines", "artifact-registry", "docker-in-docker", "gitness", "drone"]
platforms   = ["linux/amd64", "linux/arm64"]
icon        = "https://github.com/harness.png"
website     = "https://www.harness.io/open-source"
docs        = "https://developer.harness.io/docs/open-source"
source      = "https://github.com/harness/harness"
license     = "Apache-2.0"

[files]
setup = "setup.md"

[[ports]]
container   = 3000
description = "Web UI, API, artifact registry and Git over HTTP"
primary     = true

[[ports]]
container   = 3022
description = "Git over SSH"
