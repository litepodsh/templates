services:
  appsmith:
    image: docker.io/appsmith/appsmith-ce:v2.2
    restart: unless-stopped
    expose:
      - "8080"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${APPSMITH_PORT}:8080"
    environment:
      APPSMITH_MAIL_ENABLED: "false"
      APPSMITH_DISABLE_TELEMETRY: "true"
    volumes:
      - appsmith_stacks:/appsmith-stacks

volumes:
  appsmith_stacks:
