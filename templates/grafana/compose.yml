services:
  grafana:
    image: docker.io/grafana/grafana:latest
    restart: unless-stopped
    expose:
      - "3000"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${GRAFANA_PORT}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_ALLOW_SIGN_UP}
    volumes:
      - grafana_data:/var/lib/grafana

  # Optional Loki log store. Uncomment this service and its volume below to enable it.
  # loki:
  #   image: docker.io/grafana/loki:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${LOKI_PORT}:3100"
  #   command: -config.file=/etc/loki/local-config.yaml
  #   volumes:
  #     - loki_data:/tmp/loki

  # Optional Prometheus metrics store. Uncomment this service and its volume below to enable it.
  # prometheus:
  #   image: docker.io/prom/prometheus:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${PROMETHEUS_PORT}:9090"
  #   command: --storage.tsdb.path=/prometheus
  #   volumes:
  #     - prometheus_data:/prometheus

volumes:
  grafana_data:
  # loki_data:
  # prometheus_data:
