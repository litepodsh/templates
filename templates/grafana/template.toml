[template]
id          = "grafana"
name        = "Grafana"
description = "Open-source dashboards and visualization for metrics, logs and traces. Bring your own data sources."
version     = "latest"
categories  = ["monitoring", "developer-tools"]
tags        = ["dashboards", "metrics", "visualization", "observability"]
icon        = "https://github.com/grafana.png"
website     = "https://grafana.com"
docs        = "https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/"
source      = "https://github.com/grafana/grafana"
license     = "AGPL-3.0-only"

[files]
setup = "setup.md"

[[ports]]
container   = 3000
description = "Web UI"
primary     = true
