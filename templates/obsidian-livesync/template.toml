description = "CouchDB server for the Self-hosted LiveSync Obsidian community plugin."
version     = "latest"
icon        = "https://github.com/vrtmrz.png"
categories  = ["productivity", "storage"]
tags        = ["obsidian", "notes", "sync", "couchdb"]
website     = "https://github.com/vrtmrz/obsidian-livesync"
