# Single-node Elasticsearch with security enabled.
#
# Elastic does not publish a rolling tag (no :latest, no :9). The image below is
# pinned to a GA release — bump it to the current one when adopting this template
# (see https://www.docker.elastic.co). Do not downgrade over an existing
# elasticsearch_data volume; Elasticsearch refuses to start on newer-version data.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    restart: unless-stopped
    expose:
      - "9200"
    # Uncomment to publish the REST API directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${ELASTICSEARCH_PORT}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: ${ELASTICSEARCH_SECURITY_ENABLED}
      xpack.security.http.ssl.enabled: ${ELASTICSEARCH_HTTP_SSL_ENABLED}
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS}
      bootstrap.memory_lock: "true"
      cluster.name: ${ELASTICSEARCH_CLUSTER_NAME}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: ${ELASTICSEARCH_HEALTHCHECK_INTERVAL}
      timeout: ${ELASTICSEARCH_HEALTHCHECK_TIMEOUT}
      retries: ${ELASTICSEARCH_HEALTHCHECK_RETRIES}
      start_period: ${ELASTICSEARCH_HEALTHCHECK_START_PERIOD}

volumes:
  elasticsearch_data:
