services:
  termix:
    image: ghcr.io/termix-ssh/termix:latest
    restart: unless-stopped
    expose:
      - "8080"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${TERMIX_PORT}:8080"
    environment:
      PORT: "8080"
      # guacd (Remote Desktop plugin) is reached by service name over the Compose network.
      GUACD_HOST: guacd
      GUACD_TUNNEL_HOST: termix
      GUACD_RECORDING_PATH: /termix-data/session_recordings/guacamole
      GUACD_DRIVE_PATH: /termix-data/rdp-drive
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_KEY: ${DATABASE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
    volumes:
      # Same volume as guacd, but guacd sees it at /termix-data (its recording/drive paths).
      - termix_data:/app/data
    depends_on:
      - guacd

  guacd:
    # RDP/VNC/Telnet backend for the Remote Desktop plugin. Internal to the Compose network.
    image: docker.io/guacamole/guacd:1.6.0
    restart: unless-stopped
    volumes:
      - termix_data:/termix-data

volumes:
  termix_data:
