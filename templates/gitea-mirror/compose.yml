services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    restart: unless-stopped
    expose:
      - "4321"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${GITEA_MIRROR_PORT}:4321"
    environment:
      NODE_ENV: ${GITEA_MIRROR_NODE_ENV}
      DATABASE_URL: ${GITEA_MIRROR_DATABASE_URL}
      HOST: ${GITEA_MIRROR_HOST}
      PORT: ${GITEA_MIRROR_CONTAINER_PORT}
      BASE_URL: ${GITEA_MIRROR_BASE_URL}
      BETTER_AUTH_SECRET: ${GITEA_MIRROR_AUTH_SECRET}
      BETTER_AUTH_URL: ${GITEA_MIRROR_AUTH_URL}
      PUBLIC_BETTER_AUTH_URL: ${GITEA_MIRROR_PUBLIC_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${GITEA_MIRROR_AUTH_TRUSTED_ORIGINS}
      MIRROR_ISSUE_CONCURRENCY: ${GITEA_MIRROR_ISSUE_CONCURRENCY}
      MIRROR_PULL_REQUEST_CONCURRENCY: ${GITEA_MIRROR_PULL_REQUEST_CONCURRENCY}
    volumes:
      - gitea_mirror_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "BASE=\"$${BASE_URL}\"; if [ \"$${BASE}\" = \"/\" ]; then BASE=\"\"; else BASE=\"$${BASE%/}\"; fi; wget --no-verbose --tries=3 --spider \"http://localhost:4321$${BASE}/api/health\""]
      interval: ${GITEA_MIRROR_HEALTHCHECK_INTERVAL}
      timeout: ${GITEA_MIRROR_HEALTHCHECK_TIMEOUT}
      retries: ${GITEA_MIRROR_HEALTHCHECK_RETRIES}
      start_period: ${GITEA_MIRROR_HEALTHCHECK_START_PERIOD}

volumes:
  gitea_mirror_data:
