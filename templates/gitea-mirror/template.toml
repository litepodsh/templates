[template]
id          = "gitea-mirror"
name        = "Gitea Mirror"
description = "Automatically mirror GitHub repositories to your self-hosted Gitea or Forgejo instance."
version     = "latest"
categories  = ["developer-tools", "collaboration"]
tags        = ["git", "forge", "mirror", "backup", "migration"]
icon        = "https://raw.githubusercontent.com/RayLabsHQ/gitea-mirror/main/public/logo.png"
website     = "https://github.com/RayLabsHQ/gitea-mirror"
docs        = "https://github.com/RayLabsHQ/gitea-mirror#readme"
source      = "https://github.com/RayLabsHQ/gitea-mirror"
license     = "AGPL-3.0"

[files]
setup = "setup.md"

[[ports]]
container   = 4321
description = "Web UI"
primary     = true
