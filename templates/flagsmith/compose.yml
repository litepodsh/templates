# Image is fully qualified: Podman has no implicit docker.io fallback unless
# unqualified-search-registries is configured. The unified image serves the
# dashboard and the REST API on one port; its default command runs migrations
# before serving.
services:
  flagsmith:
    image: docker.io/flagsmith/flagsmith:latest
    restart: unless-stopped
    ports:
      - "${FLAGSMITH_HTTP_PORT}:8000"
    environment:
      DATABASE_URL: postgresql://${FLAGSMITH_DB_USER}:${FLAGSMITH_DB_PASSWORD}@postgres:5432/${FLAGSMITH_DB_NAME}
      DJANGO_SECRET_KEY: ${FLAGSMITH_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${FLAGSMITH_ALLOWED_HOSTS}
      ENVIRONMENT: production
      FLAGSMITH_DOMAIN: ${FLAGSMITH_DOMAIN}
      USE_POSTGRES_FOR_ANALYTICS: "true"
      PREVENT_SIGNUP: ${FLAGSMITH_PREVENT_SIGNUP}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "flagsmith", "healthcheck", "tcp"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLAGSMITH_DB_NAME}
      POSTGRES_USER: ${FLAGSMITH_DB_USER}
      POSTGRES_PASSWORD: ${FLAGSMITH_DB_PASSWORD}
    # Named volume rather than a bind mount so it works rootless.
    volumes:
      - flagsmith_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FLAGSMITH_DB_USER} -d ${FLAGSMITH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  flagsmith_postgres_data: