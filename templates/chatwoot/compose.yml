# Rails and Sidekiq share one env; the `x-chatwoot-env` anchor keeps them in
# sync. Image tags are literal (LitePod pre-pulls `image:` as written, without
# .env interpolation) and services avoid `<<:` merge keys for the same reason.
# `chatwoot` runs `db:chatwoot_prepare` (create + migrate, idempotent) before
# booting, and the worker waits for it to be healthy.
x-chatwoot-env: &chatwoot-env
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
  FORCE_SSL: ${CHATWOOT_FORCE_SSL}
  ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_ENABLE_ACCOUNT_SIGNUP}
  DEFAULT_LOCALE: ${CHATWOOT_DEFAULT_LOCALE}
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  LOG_LEVEL: ${CHATWOOT_LOG_LEVEL}
  RAILS_MAX_THREADS: ${CHATWOOT_RAILS_MAX_THREADS}
  ACTIVE_STORAGE_SERVICE: local
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: ${CHATWOOT_DB_NAME}
  POSTGRES_USERNAME: ${CHATWOOT_DB_USER}
  POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
  MAILER_SENDER_EMAIL: ${CHATWOOT_MAILER_SENDER_EMAIL}
  SMTP_ADDRESS: ${CHATWOOT_SMTP_ADDRESS}
  SMTP_PORT: ${CHATWOOT_SMTP_PORT}
  SMTP_DOMAIN: ${CHATWOOT_SMTP_DOMAIN}
  SMTP_USERNAME: ${CHATWOOT_SMTP_USERNAME}
  SMTP_PASSWORD: ${CHATWOOT_SMTP_PASSWORD}
  SMTP_AUTHENTICATION: ${CHATWOOT_SMTP_AUTHENTICATION}
  SMTP_ENABLE_STARTTLS_AUTO: ${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}

services:
  chatwoot:
    image: docker.io/chatwoot/chatwoot:v4.18.0
    restart: unless-stopped
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["sh", "-c", "bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0"]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  chatwoot-worker:
    image: docker.io/chatwoot/chatwoot:v4.18.0
    restart: unless-stopped
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHATWOOT_DB_NAME}
      POSTGRES_USER: ${CHATWOOT_DB_USER}
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHATWOOT_DB_USER} -d ${CHATWOOT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
      REDISCLI_AUTH: ${CHATWOOT_REDIS_PASSWORD}
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chatwoot_storage:
  chatwoot_postgres_data:
  chatwoot_redis_data:
