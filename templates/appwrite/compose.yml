services:
  appwrite:
    image: docker.io/appwrite/appwrite:latest
    restart: unless-stopped
    ports:
      - "${APPWRITE_PORT}:80"
    environment:
      _APP_ENV: ${APPWRITE_ENV}
      _APP_OPENSSL_KEY_V1: ${APPWRITE_OPENSSL_KEY}
      _APP_EXECUTOR_SECRET: ${APPWRITE_EXECUTOR_SECRET}
      _APP_DOMAIN: ${APPWRITE_DOMAIN}
      _APP_REDIS_HOST: ${APPWRITE_REDIS_HOST}
      _APP_REDIS_PORT: ${APPWRITE_REDIS_PORT}
      _APP_DB_ADAPTER: ${APPWRITE_DB_ADAPTER}
      _APP_DB_HOST: ${APPWRITE_DB_HOST}
      _APP_DB_PORT: ${APPWRITE_DB_PORT}
      _APP_DB_SCHEMA: ${APPWRITE_DB_SCHEMA}
      _APP_DB_USER: ${APPWRITE_DB_USER}
      _APP_DB_PASS: ${APPWRITE_DB_PASSWORD}
    volumes:
      - appwrite_uploads:/storage/uploads
      - appwrite_cache:/storage/cache
      - appwrite_config:/storage/config
      - appwrite_functions:/storage/functions
      - appwrite_builds:/storage/builds
    depends_on:
      - redis
      - mongodb
  redis:
    image: docker.io/library/redis:latest
    restart: unless-stopped
    volumes:
      - appwrite_redis_data:/data
  mongodb:
    image: docker.io/library/mongo:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${APPWRITE_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${APPWRITE_DB_PASSWORD}
    volumes:
      - appwrite_mongodb_data:/data/db

volumes:
  appwrite_uploads:
  appwrite_cache:
  appwrite_config:
  appwrite_functions:
  appwrite_builds:
  appwrite_redis_data:
  appwrite_mongodb_data:
