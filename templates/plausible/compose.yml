services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    expose:
      - "8000"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${PLAUSIBLE_PORT}:8000"
    environment:
      BASE_URL: ${PLAUSIBLE_BASE_URL}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE}
      DISABLE_REGISTRATION: ${PLAUSIBLE_DISABLE_REGISTRATION}
      DATABASE_URL: postgres://${PLAUSIBLE_DB_USER}:${PLAUSIBLE_DB_PASSWORD}@db:5432/${PLAUSIBLE_DB_NAME}
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/${PLAUSIBLE_CLICKHOUSE_DB_NAME}
      TMPDIR: /var/lib/plausible/tmp
    volumes:
      - plausible_data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLAUSIBLE_DB_NAME}
      POSTGRES_USER: ${PLAUSIBLE_DB_USER}
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD}
    volumes:
      - plausible_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAUSIBLE_DB_USER} -d ${PLAUSIBLE_DB_NAME}"]
      interval: ${PLAUSIBLE_DB_HEALTHCHECK_INTERVAL}
      timeout: ${PLAUSIBLE_DB_HEALTHCHECK_TIMEOUT}
      retries: ${PLAUSIBLE_DB_HEALTHCHECK_RETRIES}
  # 26.8 is an LTS line; do not downgrade over an existing data volume.
  # Upstream's logs.xml, ipv4-only.xml and low-resources configs are written at
  # start instead of bind-mounted.
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.30.8-alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/clickhouse-server/config.d/plausible.xml <<'XML'
        <clickhouse>
          <logger>
            <level>warning</level>
            <console>true</console>
          </logger>
          <query_log replace="1">
            <database>system</database>
            <table>query_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <engine>
              ENGINE = MergeTree
              PARTITION BY event_date
              ORDER BY (event_time)
              TTL event_date + interval 30 day
              SETTINGS ttl_only_drop_parts=1
            </engine>
          </query_log>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <query_thread_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
          <mark_cache_size>524288000</mark_cache_size>
        </clickhouse>
        XML
        cat > /etc/clickhouse-server/users.d/plausible.xml <<'XML'
        <clickhouse>
          <profiles>
            <default>
              <max_threads>1</max_threads>
              <max_block_size>8192</max_block_size>
              <max_download_threads>1</max_download_threads>
              <input_format_parallel_parsing>0</input_format_parallel_parsing>
              <output_format_parallel_formatting>0</output_format_parallel_formatting>
            </default>
          </profiles>
        </clickhouse>
        XML
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_DB: ${PLAUSIBLE_CLICKHOUSE_DB_NAME}
      CLICKHOUSE_SKIP_USER_SETUP: ${PLAUSIBLE_CLICKHOUSE_SKIP_USER_SETUP}
    volumes:
      - plausible_clickhouse_data:/var/lib/clickhouse
      - plausible_clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: ${PLAUSIBLE_CLICKHOUSE_HEALTHCHECK_INTERVAL}
      timeout: ${PLAUSIBLE_CLICKHOUSE_HEALTHCHECK_TIMEOUT}
      retries: ${PLAUSIBLE_CLICKHOUSE_HEALTHCHECK_RETRIES}

volumes:
  plausible_data:
  plausible_postgres_data:
  plausible_clickhouse_data:
  plausible_clickhouse_logs:
