services:
  plausible:
    image: ghcr.io/plausible/community-edition:latest
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    expose:
      - "8000"
    # Uncomment to publish the UI directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${PLAUSIBLE_PORT}:8000"
    environment:
      BASE_URL: ${PLAUSIBLE_BASE_URL}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE}
      DISABLE_REGISTRATION: ${PLAUSIBLE_DISABLE_REGISTRATION}
      DATABASE_URL: postgres://${PLAUSIBLE_DB_USER}:${PLAUSIBLE_DB_PASSWORD}@db:5432/${PLAUSIBLE_DB_NAME}
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/${PLAUSIBLE_CLICKHOUSE_DB_NAME}
    volumes:
      - plausible_data:/var/lib/plausible
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLAUSIBLE_DB_NAME}
      POSTGRES_USER: ${PLAUSIBLE_DB_USER}
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD}
    volumes:
      - plausible_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAUSIBLE_DB_USER} -d ${PLAUSIBLE_DB_NAME}"]
      interval: ${PLAUSIBLE_DB_HEALTHCHECK_INTERVAL}
      timeout: ${PLAUSIBLE_DB_HEALTHCHECK_TIMEOUT}
      retries: ${PLAUSIBLE_DB_HEALTHCHECK_RETRIES}
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${PLAUSIBLE_CLICKHOUSE_DB_NAME}
      CLICKHOUSE_SKIP_USER_SETUP: ${PLAUSIBLE_CLICKHOUSE_SKIP_USER_SETUP}
    volumes:
      - plausible_clickhouse_data:/var/lib/clickhouse
      - plausible_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: ${PLAUSIBLE_CLICKHOUSE_HEALTHCHECK_INTERVAL}
      timeout: ${PLAUSIBLE_CLICKHOUSE_HEALTHCHECK_TIMEOUT}
      retries: ${PLAUSIBLE_CLICKHOUSE_HEALTHCHECK_RETRIES}

volumes:
  plausible_data:
  plausible_postgres_data:
  plausible_clickhouse_data:
  plausible_clickhouse_logs:
