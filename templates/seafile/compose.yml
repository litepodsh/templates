# Seafile 13 Community Edition, adapted from the official seafile-server.yml.
# LitePod's reverse proxy replaces the upstream Caddy front-end, so the seafile
# service exposes port 80 directly. SeaDoc and the notification server are left
# disabled; enable them by adding the extra services from the upstream repo.
services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - seafile_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - seafile_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seafile:
    image: docker.io/seafileltd/seafile-mc:13.0-latest
    restart: unless-stopped
    expose:
      - "80"
    # Uncomment to publish Seafile directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${SEAFILE_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: ${SEAFILE_MYSQL_DB_USER}
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ${SEAFILE_MYSQL_DB_CCNET_DB_NAME}
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: ${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME}
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: ${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME}
      TIME_ZONE: ${TIME_ZONE}
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
      SEAFILE_SERVER_PROTOCOL: ${SEAFILE_SERVER_PROTOCOL}
      SITE_ROOT: "/"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      ENABLE_GO_FILESERVER: "true"
      ENABLE_SEADOC: "false"
      CACHE_PROVIDER: ${CACHE_PROVIDER}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_NOTIFICATION_SERVER: "false"
    volumes:
      - seafile_data:/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  seafile_data:
  seafile_db_data:
  seafile_redis_data:
