[template]
id          = "seafile"
name        = "Seafile"
description = "Fast, lightweight file sync and sharing with block-level deduplication, web UI, WebDAV, and desktop/mobile clients. A Dropbox alternative that scales."
version     = "13.0"
categories  = ["storage", "collaboration"]
tags        = ["seafile", "cloud", "files", "file-sync", "sharing", "webdav", "mariadb", "redis"]
platforms   = ["linux/amd64", "linux/arm64"]
icon        = "https://github.com/haiwen.png"
website     = "https://www.seafile.com"
docs        = "https://manual.seafile.com/latest/setup/setup_ce_by_docker/"
source      = "https://github.com/haiwen/seafile"
license     = "AGPL-3.0"
url_persisted = true

[files]
setup = "setup.md"

[[ports]]
container   = 80
description = "Web UI, WebDAV & sync endpoint"
primary     = true
