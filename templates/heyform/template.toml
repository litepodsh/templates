[template]
id          = "heyform"
name        = "HeyForm"
description = "Open-source form builder for conversational forms, surveys, quizzes, and polls, with logic jumps, file uploads, and analytics."
version     = "latest"
categories  = ["forms", "productivity"]
tags        = ["forms", "surveys", "quiz", "mongodb", "keydb"]
icon        = "https://github.com/heyform.png"
website     = "https://heyform.net"
docs        = "https://docs.heyform.net/open-source/self-hosting"
source      = "https://github.com/heyform/heyform"
license     = "AGPL-3.0"

[files]
setup = "setup.md"

[[ports]]
container   = 8000
description = "Web UI & API"
primary     = true
