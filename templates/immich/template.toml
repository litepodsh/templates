[template]
id          = "immich"
name        = "Immich"
description = "Self-hosted photo and video backup — mobile auto-upload, ML-powered search and face recognition, albums, and timeline browsing. A Google Photos alternative."
version     = "release"
categories  = ["photos", "media"]
tags        = ["photos", "backup", "gallery", "machine-learning", "postgresql"]
icon        = "https://github.com/immich-app.png"
website     = "https://immich.app"
docs        = "https://docs.immich.app/install/docker-compose"
source      = "https://github.com/immich-app/immich"
license     = "AGPL-3.0"

[files]
setup = "setup.md"

[[ports]]
container   = 2283
description = "Web UI, API & mobile endpoint"
primary     = true
