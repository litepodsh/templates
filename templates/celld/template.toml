[template]
id          = "celld"
name        = "celld"
description = "Self-hosted, distributed Durable Objects: runs Cloudflare Workers apps (DO, KV, Queues, D1, R2, Workflows) on your own machines with state in your S3 bucket."
version     = "latest"
categories  = ["developer-tools"]
tags        = ["cloudflare-workers", "durable-objects", "serverless", "sqlite", "d1", "kv", "queues"]
platforms   = ["linux/amd64", "linux/arm64"]
icon        = "https://github.com/denoland.png"
website     = "https://celld.dev"
docs        = "https://celld.dev/docs"
source      = "https://github.com/denoland/celld"
license     = "Apache-2.0"

[files]
setup = "setup.md"

[[ports]]
container   = 8080
description = "Public Worker listener"
primary     = true
