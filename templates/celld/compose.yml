services:
  celld:
    image: ghcr.io/denoland/celld:latest
    restart: unless-stopped
    ports:
      - "${CELLD_PORT}:8080"
    environment:
      CELLD_BUCKET: ${CELLD_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CELLD_ADDR: 0.0.0.0:8080
      # Operator/peer listener. Loopback keeps /reload and /shutdown private
      # to the container; a single node has no peers.
      CELLD_INTERNAL_ADDR: 127.0.0.1:8081
      CELLD_WATCH: /var/lib/celld/state
      CELLD_DEPLOY_POLL_S: ${CELLD_DEPLOY_POLL_S}
    volumes:
      - celld_state:/var/lib/celld

volumes:
  celld_state:
