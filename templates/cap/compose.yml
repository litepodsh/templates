# Image is fully qualified: Podman has no implicit docker.io fallback unless
# unqualified-search-registries is configured.
services:
  cap:
    image: docker.io/tiago2/cap:latest
    restart: unless-stopped
    ports:
      - "${CAP_PORT}:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY}
      REDIS_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy

  # Valkey (Redis-compatible) stores sessions, API keys and challenge state.
  # Internal to the Compose network only; it is not published on the host.
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  valkey_data:
