[template]
id          = "cap"
name        = "Cap"
description = "Privacy-first, self-hosted CAPTCHA that uses proof-of-work and instrumentation challenges instead of puzzles."
version     = "latest"
categories  = ["security"]
tags        = ["captcha", "anti-bot", "proof-of-work", "anti-abuse", "anti-scraper"]
platforms   = ["linux/amd64", "linux/arm64"]
icon        = "https://raw.githubusercontent.com/tiagozip/cap/main/docs/public/logo.png"
website     = "https://trycap.dev"
docs        = "https://trycap.dev/guide/standalone/"
source      = "https://github.com/tiagozip/cap"
license     = "Apache-2.0"

[files]
setup = "setup.md"

[[ports]]
container   = 3000
description = "Web UI and API"
primary     = true
