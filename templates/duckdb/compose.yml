# DuckDB self-hosted as a Quack server.
#
# The official duckdb/duckdb image is the CLI on a shell-less distroless base.
# To keep the Quack server alive, the CLI is left interactive with stdin open
# (`stdin_open: true`) and the bootstrap SQL is passed through `-cmd`, so it
# runs on every boot with the current token and needs no init service.
#
# Quack is still in beta and the protocol, function names and defaults are
# subject to change. Pin the image to a specific DuckDB release and bump it
# consciously — there is no rolling tag worth tracking for a server.
services:
  duckdb:
    image: docker.io/duckdb/duckdb:1.5.6
    # Open the persistent database and start the Quack server, then keep the
    # CLI alive by leaving stdin open (stdin_open below).
    command: ["/duckdb", "/data/main.duckdb", "-cmd", "INSTALL quack; LOAD quack; CALL quack_serve('quack:0.0.0.0:9494', allow_other_hostname => true, token => '${DUCKDB_AUTH_TOKEN}');"]
    restart: unless-stopped
    stdin_open: true
    expose:
      - "9494"
    # Uncomment to publish the Quack endpoint directly on the host instead of
    # only exposing it to the Compose network. Quack speaks plain HTTP; for
    # anything beyond a trusted LAN, front it with a TLS-terminating reverse
    # proxy (see setup.md).
    # ports:
    #   - "${DUCKDB_PORT}:9494"
    environment:
      # Keep the home directory on the data volume so the installed `quack`
      # extension survives restarts.
      HOME: /data
    volumes:
      - duckdb_data:/data
    healthcheck:
      test: ["CMD", "/duckdb", ":memory:", "-c", "INSTALL quack; LOAD quack; FROM quack_query('quack:localhost:9494', 'SELECT 1', token => '${DUCKDB_AUTH_TOKEN}');"]
      interval: ${DUCKDB_HEALTHCHECK_INTERVAL}
      timeout: ${DUCKDB_HEALTHCHECK_TIMEOUT}
      retries: ${DUCKDB_HEALTHCHECK_RETRIES}
      start_period: ${DUCKDB_HEALTHCHECK_START_PERIOD}

volumes:
  duckdb_data:
