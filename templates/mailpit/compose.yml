# Image is fully qualified: Podman has no implicit docker.io fallback unless
# unqualified-search-registries is configured.
services:
  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MP_MAX_MESSAGES}
      MP_SMTP_AUTH_ACCEPT_ANY: ${MP_SMTP_AUTH_ACCEPT_ANY}
      MP_SMTP_AUTH_ALLOW_INSECURE: ${MP_SMTP_AUTH_ALLOW_INSECURE}
      MP_UI_AUTH: ${MP_AUTH_USER}:${MP_AUTH_PASS}
      MP_SMTP_AUTH: ${MP_AUTH_USER}:${MP_AUTH_PASS}
    # Named volume rather than a bind mount so it works rootless.
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
