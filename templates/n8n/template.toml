[template]
id          = "n8n"
name        = "n8n"
description = "Workflow automation tool — connect APIs, services and databases with a fair-code visual editor and 400+ integrations."
version     = "latest"
categories  = ["automation", "developer-tools"]
tags        = ["workflow", "automation", "integrations", "low-code", "webhooks"]
icon        = "https://github.com/n8n-io.png"
website     = "https://n8n.io"
docs        = "https://docs.n8n.io/hosting/"
source      = "https://github.com/n8n-io/n8n"
license     = "Sustainable Use License"

[files]
setup = "setup.md"

[[ports]]
container   = 5678
description = "Editor UI, REST API & webhooks"
primary     = true
