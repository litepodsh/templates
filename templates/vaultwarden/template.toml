[template]
id          = "vaultwarden"
name        = "Vaultwarden"
description = "Lightweight, self-hosted password manager compatible with the Bitwarden clients and browser extensions."
version     = "latest"
categories  = ["security", "productivity"]
tags        = ["password-manager", "bitwarden", "vault", "secrets"]
icon        = "logo.svg"
website     = "https://github.com/dani-garcia/vaultwarden"
docs        = "https://github.com/dani-garcia/vaultwarden/wiki"
source      = "https://github.com/dani-garcia/vaultwarden"
license     = "AGPL-3.0"

[files]
setup = "setup.md"

[[ports]]
container   = 80
description = "Web vault & API"
primary     = true
