services:
  vaultwarden:
    image: docker.io/vaultwarden/server:latest
    restart: unless-stopped
    expose:
      - "80"
    # Uncomment to publish the web vault directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${VAULTWARDEN_PORT}:80"
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      SIGNUPS_VERIFY: ${VAULTWARDEN_SIGNUPS_VERIFY}
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SMTP_HOST: ${VAULTWARDEN_SMTP_HOST}
      SMTP_FROM: ${VAULTWARDEN_SMTP_FROM}
      SMTP_PORT: ${VAULTWARDEN_SMTP_PORT}
      SMTP_SECURITY: ${VAULTWARDEN_SMTP_SECURITY}
      SMTP_USERNAME: ${VAULTWARDEN_SMTP_USERNAME}
      SMTP_PASSWORD: ${VAULTWARDEN_SMTP_PASSWORD}
    volumes:
      - vaultwarden_data:/data

volumes:
  vaultwarden_data:
