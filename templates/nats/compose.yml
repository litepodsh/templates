services:
  nats:
    image: docker.io/library/nats:2.15.0
    restart: unless-stopped
    # `-js` enables JetStream; `-sd` stores its streams under the mounted volume.
    # `-m` serves the HTTP monitoring endpoint (/varz, /jsz, /healthz).
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
      - "--user"
      - "${NATS_USER}"
      - "--pass"
      - "${NATS_PASSWORD}"
    # Clients speak raw TCP, not HTTP, so the reverse proxy cannot route 4222;
    # publish it on the host.
    ports:
      - "${NATS_PORT}:4222"
    expose:
      - "8222" # HTTP monitoring; route through Litepod
    # Uncomment to ALSO publish the monitoring endpoint directly on the host.
    # ports:
    #   - "${NATS_MONITOR_PORT}:8222"
    volumes:
      - nats_data:/data
    deploy:
      resources:
        limits:
          cpus: "${NATS_CPUS}"
          memory: ${NATS_MEMORY}

volumes:
  nats_data:
