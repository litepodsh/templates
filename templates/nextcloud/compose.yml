# Nextcloud official image (Apache variant) with PostgreSQL and Redis. Based on
# the upstream docker-compose example, adapted to named volumes and
# fully-qualified images. `nextcloud` and `cron` share nextcloud_html so both see the
# same install, config and data.
services:
  nextcloud:
    image: docker.io/library/nextcloud:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "80"
    # Uncomment to publish Nextcloud directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${NEXTCLOUD_PORT}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL}
      POSTGRES_HOST: db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_PHP_UPLOAD_LIMIT}
    volumes:
      - nextcloud_html:/var/www/html

  cron:
    image: docker.io/library/nextcloud:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /cron.sh
    volumes:
      - nextcloud_html:/var/www/html

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER} -d ${NEXTCLOUD_DB_NAME}"]
      interval: ${NEXTCLOUD_DB_HEALTHCHECK_INTERVAL}
      timeout: ${NEXTCLOUD_DB_HEALTHCHECK_TIMEOUT}
      retries: ${NEXTCLOUD_DB_HEALTHCHECK_RETRIES}

  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - nextcloud_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nextcloud_html:
  nextcloud_db_data:
  nextcloud_redis_data:
