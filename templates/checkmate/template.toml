description = "Self-hosted monitoring for uptime, response time, incidents, server hardware, Docker containers, and public status pages."
version     = "latest"
categories  = ["monitoring", "devops"]
tags        = ["uptime", "monitoring", "status-page", "incidents", "mongodb"]
