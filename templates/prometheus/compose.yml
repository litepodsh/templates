# The config lives in the `prometheus_config` named volume mounted at
# /etc/prometheus. On first start the volume is empty, so the container runtime
# copies the image's default prometheus.yml into it — from then on it is a real
# file you can edit (e.g. through LitePod's volume file editor) and reload with
# `POST /-/reload` (--web.enable-lifecycle is set). Rule files can go in the same
# volume, e.g. /etc/prometheus/rules/.
#
# NOTE: `command:` replaces the image's default args entirely, so --config.file
# and --storage.tsdb.path must be repeated or Prometheus looks for a relative
# prometheus.yml that doesn't exist and crash-loops.
services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    restart: unless-stopped
    expose:
      - "9090"
    # Uncomment to publish the UI/API directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${PROMETHEUS_PORT}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: ${PROMETHEUS_HEALTHCHECK_INTERVAL}
      timeout: ${PROMETHEUS_HEALTHCHECK_TIMEOUT}
      retries: ${PROMETHEUS_HEALTHCHECK_RETRIES}
      start_period: ${PROMETHEUS_HEALTHCHECK_START_PERIOD}

volumes:
  prometheus_config:
  prometheus_data:
