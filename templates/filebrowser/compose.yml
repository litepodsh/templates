services:
  filebrowser:
    image: docker.io/filebrowser/filebrowser:latest
    restart: unless-stopped
    expose:
      - "80"
    # Uncomment to publish File Browser directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${FILEBROWSER_PORT}:80"
    environment:
      # Directory served to users. Mount the data you want to expose at this path.
      FB_ROOT: ${FILEBROWSER_ROOT}
      # Bolt database holding users, settings and shares.
      FB_DATABASE: ${FILEBROWSER_DATABASE}
      FB_ADDRESS: 0.0.0.0
      FB_PORT: "80"
      FB_LOG: stdout
    volumes:
      - filebrowser_srv:/srv
      - filebrowser_database:/database

volumes:
  filebrowser_srv:
  filebrowser_database:
