# SonarQube embeds Elasticsearch, so the host kernel needs
# vm.max_map_count=262144 or the container exits on startup (see setup.md).
services:
  sonarqube:
    image: docker.io/library/sonarqube:community
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"
    # Uncomment to publish SonarQube directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${SONARQUBE_PORT}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${SONARQUBE_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 8192
        hard: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: ${SONARQUBE_HEALTHCHECK_INTERVAL}
      timeout: ${SONARQUBE_HEALTHCHECK_TIMEOUT}
      retries: ${SONARQUBE_HEALTHCHECK_RETRIES}
      start_period: ${SONARQUBE_HEALTHCHECK_START_PERIOD}

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_NAME}
      POSTGRES_USER: ${SONARQUBE_DB_USER}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONARQUBE_DB_USER} -d ${SONARQUBE_DB_NAME}"]
      interval: ${SONARQUBE_DB_HEALTHCHECK_INTERVAL}
      timeout: ${SONARQUBE_DB_HEALTHCHECK_TIMEOUT}
      retries: ${SONARQUBE_DB_HEALTHCHECK_RETRIES}

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgres_data:
