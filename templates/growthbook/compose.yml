# Image is fully qualified: Podman has no implicit docker.io fallback unless
# unqualified-search-registries is configured.
services:
  growthbook:
    image: docker.io/growthbook/growthbook:latest
    restart: unless-stopped
    ports:
      - "${GROWTHBOOK_HTTP_PORT}:3000"
      - "${GROWTHBOOK_API_PORT}:3100"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${GROWTHBOOK_MONGO_USER}:${GROWTHBOOK_MONGO_PASSWORD}@mongo:27017/${GROWTHBOOK_MONGO_DB}?authSource=admin
      JWT_SECRET: ${GROWTHBOOK_JWT_SECRET}
      ENCRYPTION_KEY: ${GROWTHBOOK_ENCRYPTION_KEY}
      APP_ORIGIN: ${GROWTHBOOK_APP_ORIGIN}
      API_HOST: ${GROWTHBOOK_API_HOST}
    # Named volumes rather than bind mounts so they work rootless.
    volumes:
      - growthbook_uploads:/usr/local/src/app/packages/back-end/uploads
    depends_on:
      mongo:
        condition: service_healthy
    # No healthcheck: the image is a shell-less distroless runtime.

  mongo:
    image: docker.io/library/mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${GROWTHBOOK_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${GROWTHBOOK_MONGO_PASSWORD}
    volumes:
      - growthbook_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${GROWTHBOOK_MONGO_USER} --password ${GROWTHBOOK_MONGO_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  growthbook_uploads:
  growthbook_mongo_data: