services:
  documenso:
    image: docker.io/documenso/documenso:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Uncomment to publish Documenso directly on the host instead of only exposing it to the Compose network.
    # ports:
    #   - "${DOCUMENSO_PORT}:3000"
    environment:
      PORT: "3000"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_WEBAPP_URL}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@db:5432/${DOCUMENSO_DB_NAME}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://${DOCUMENSO_DB_USER}:${DOCUMENSO_DB_PASSWORD}@db:5432/${DOCUMENSO_DB_NAME}
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DOCUMENSO_DISABLE_SIGNUP}
      NEXT_PRIVATE_SMTP_TRANSPORT: ${DOCUMENSO_SMTP_TRANSPORT}
      NEXT_PRIVATE_SMTP_HOST: ${DOCUMENSO_SMTP_HOST}
      NEXT_PRIVATE_SMTP_PORT: ${DOCUMENSO_SMTP_PORT}
      NEXT_PRIVATE_SMTP_USERNAME: ${DOCUMENSO_SMTP_USERNAME}
      NEXT_PRIVATE_SMTP_PASSWORD: ${DOCUMENSO_SMTP_PASSWORD}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_SMTP_FROM_NAME}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_SMTP_FROM_ADDRESS}
    volumes:
      - documenso_data:/opt/documenso

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCUMENSO_DB_NAME}
      POSTGRES_USER: ${DOCUMENSO_DB_USER}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD}
    volumes:
      - documenso_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_DB_USER} -d ${DOCUMENSO_DB_NAME}"]
      interval: ${DOCUMENSO_DB_HEALTHCHECK_INTERVAL}
      timeout: ${DOCUMENSO_DB_HEALTHCHECK_TIMEOUT}
      retries: ${DOCUMENSO_DB_HEALTHCHECK_RETRIES}

volumes:
  documenso_data:
  documenso_db_data:
