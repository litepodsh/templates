[template]
id          = "wealthfolio"
name        = "Wealthfolio"
description = "Private investment tracker for portfolios, net worth, dividends and goals across brokers and currencies."
version     = "3.10.0"
categories  = ["finance"]
tags        = ["investments", "portfolio", "net-worth", "dividends", "sqlite", "rust"]
platforms   = ["linux/amd64", "linux/arm64"]
icon        = "https://github.com/wealthfolio.png"
website     = "https://wealthfolio.app"
docs        = "https://wealthfolio.app/docs/guide/self-hosting/"
source      = "https://github.com/wealthfolio/wealthfolio"
license     = "AGPL-3.0"

[files]
setup = "setup.md"

[[ports]]
container   = 8088
description = "Web UI and API"
primary     = true
